apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: image-cache-claim
      containers:
        - name: todo-app
          image: PROJECT/IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: project-config
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: image-cache
              mountPath: /app/data