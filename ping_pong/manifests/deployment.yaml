apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: gcr.io/dwk-gke-513110/ping-pong:3.2
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ping-pong-database-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingpong-secret
                  key: postgres-password
          ports:
            - containerPort: 3000
