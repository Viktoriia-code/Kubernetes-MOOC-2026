apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: vikikone/ping-pong:4.4
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ping-pong-database-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingpong-secret
                  key: postgres-password
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /pings
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: ping-pong-cpu-usage