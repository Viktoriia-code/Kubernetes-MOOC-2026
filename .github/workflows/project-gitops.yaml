name: Todo Project GitOps

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'todo_app/**'
      - 'todo_backend/**'
      - 'todo_broadcaster/**'
      - '.github/workflows/project-gitops.yaml'

permissions:
  contents: write

jobs:
  build-publish:
    name: Build and Push
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Todo App
        run: |
          docker build -t vikikone/todo-app:$IMAGE_TAG ./todo_app
          docker push vikikone/todo-app:$IMAGE_TAG

      - name: Build and publish Todo Backend
        run: |
          docker build -t vikikone/todo-backend:$IMAGE_TAG ./todo_backend
          docker push vikikone/todo-backend:$IMAGE_TAG

      - name: Build and publish Todo Broadcaster
        run: |
          docker build -t vikikone/todo-broadcaster:$IMAGE_TAG ./todo_broadcaster
          docker push vikikone/todo-broadcaster:$IMAGE_TAG

      - name: Check out main for production release
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git checkout main

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update environment images
        run: |
          kustomize edit set image \
            vikikone/todo-app=vikikone/todo-app:$IMAGE_TAG \
            vikikone/todo-backend=vikikone/todo-backend:$IMAGE_TAG \
            vikikone/todo-broadcaster=vikikone/todo-broadcaster:$IMAGE_TAG
        working-directory: environments/overlays/${{ github.ref_type == 'tag' && 'production' || 'staging' }}

      - name: Commit environment image versions
        uses: EndBug/add-and-commit@v9
        with:
          add: "environments/overlays/${{ github.ref_type == 'tag' && 'production' || 'staging' }}/kustomization.yaml"
          message: 'Release Todo Project ${{ env.IMAGE_TAG }}'
