apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Viktoriia-code/Kubernetes-MOOC-2026.git
    path: environments/overlays/production
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
