apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: vikikone/todo-backend:v2.6
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: todo-backend-config
          ports:
            - containerPort: 3000
