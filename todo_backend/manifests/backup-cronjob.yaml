
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
  namespace: project
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-db-backup
              image: google/cloud-sdk:slim
              envFrom:
                - configMapRef:
                    name: todo-backend-config
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: todo-database-secret
                      key: postgres-password
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/run/secrets/storage/key.json
              volumeMounts:
                - name: storage-credentials
                  mountPath: /var/run/secrets/storage
                  readOnly: true
              command:
                - bash
                - -ceu
                - |
                  apt-get update
                  apt-get install -y --no-install-recommends postgresql-client
                  rm -rf /var/lib/apt/lists/*

                  gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"

                  backup_name="todos-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump \
                    --format=custom \
                    --file="/tmp/$backup_name" \
                    --host="$DB_HOST" \
                    --port="$DB_PORT" \
                    --username="$DB_USER" \
                    "$DB_NAME"

                  gcloud storage cp "/tmp/$backup_name" "gs://$GCS_BUCKET/$backup_name"
                  rm -f "/tmp/$backup_name"
          volumes:
            - name: storage-credentials
              secret:
                secretName: storage-sa-key
