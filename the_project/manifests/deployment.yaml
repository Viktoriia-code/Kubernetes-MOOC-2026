apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: image-cache-claim
      containers:
        - name: the-project
          image: vikikone/todo-app:v2.2
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3001"
            - name: TODO_BACKEND_URL
              value: http://todo-backend-svc:2345
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: image-cache
              mountPath: /app/data