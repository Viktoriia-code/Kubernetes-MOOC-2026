apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: todo-image-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd

  applicationRefs:
    - namePattern: todo-project-staging
      images:
        - alias: app
          imageName: vikikone/todo-app:staging
          commonUpdateSettings:
            updateStrategy: digest

        - alias: backend
          imageName: vikikone/todo-backend:staging
          commonUpdateSettings:
            updateStrategy: digest

        - alias: broadcaster
          imageName: vikikone/todo-broadcaster:staging
          commonUpdateSettings:
            updateStrategy: digest
        
    # Production
    - namePattern: todo-project-production
      images:
        - alias: app
          imageName: vikikone/todo-app
          commonUpdateSettings:
            updateStrategy: semver

        - alias: backend
          imageName: vikikone/todo-backend
          commonUpdateSettings:
            updateStrategy: semver

        - alias: broadcaster
          imageName: vikikone/todo-broadcaster
          commonUpdateSettings:
            updateStrategy: semver