apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output-writer
          image: vikikone/log-output:v2.5
          command: ["node", "generator.js"]
          volumeMounts:
            - name: log-status
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: vikikone/log-output:v2.5
          command: ["node", "server.js"]
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
            - name: PINGPONG_URL
              value: http://ping-pong-svc.exercises:3005/pings
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: log-status
              mountPath: /usr/src/app/files
            - name: log-output-config
              mountPath: /usr/src/app/config
              readOnly: true
      volumes:
        - name: log-status
          emptyDir: {}
        - name: log-output-config
          configMap:
            name: log-output-config