apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output-writer
          image: vikikone/log-output:v2.1
          command: ["node", "generator.js"]
          volumeMounts:
            - name: log-status
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: vikikone/log-output:v2.1
          command: ["node", "server.js"]
          env:
            - name: PINGPONG_URL
              value: http://ping-pong-svc:3005/pings
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: log-status
              mountPath: /usr/src/app/files
      volumes:
        - name: log-status
          emptyDir: {}